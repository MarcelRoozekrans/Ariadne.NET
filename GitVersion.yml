mode: Mainline
branches:
  main:
    regex: ^main$
    tag: ''
    increment: Patch
    prevent-increment-of-merged-branch-version: true
  feature:
    regex: ^(feature|feat)[/-]
    tag: alpha.{BranchName}
    increment: Inherit
  fix:
    regex: ^(fix|bugfix|hotfix)[/-]
    tag: beta.{BranchName}
    increment: Inherit
  pull-request:
    regex: ^(pull|pull-request|pr)[/-]
    tag: pr.{BranchName}
    increment: Inherit
  release:
    regex: ^release[/-]
    tag: rc
    increment: None
ignore:
  sha: []
