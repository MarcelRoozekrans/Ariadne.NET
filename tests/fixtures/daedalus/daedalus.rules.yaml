schema: 2
name: daedalus
version: "1.0.0"
author: platform-team
extends:
  - builtin://clean-architecture

layers:
  - name: Domain
    assemblies: ["Daedalus.Domain"]
  - name: Application
    assemblies: ["Daedalus.Application"]
  - name: Infrastructure
    assemblies: ["Daedalus.Infrastructure"]
  - name: WebApi
    assemblies: ["Daedalus.Api"]
  - name: Agents
    id: DAE-LAYER-AGENTS
    because: Agent code is isolated in its own layer, which only the composition root wires up.
    # Selects only the Runtime namespaces on purpose. A layer that covered the whole assembly would make
    # DAE-APP-NOT-ON-AGENTS redundant with the inherited CA-LAYER-APPLICATION rule, because a child pack
    # cannot add Agents to the allowedDependencies of Application.
    namespaces: ["Daedalus.Agents.Runtime.**"]
    description: "Agent implementations and retrieval"
    allowedDependencies: []

rules:
  - id: DAE-NO-EFCORE-IN-DOMAIN
    because: The domain stays free of persistence frameworks, so it can be tested and reused without a database.
    forbid:
      from:
        layers: [Domain]
      to:
        namespaces: ["Microsoft.EntityFrameworkCore.**"]
  # Targets the whole Daedalus.Agents assembly. The broken variant exercises it through the Contracts type,
  # which sits outside the Agents layer, so only this rule fires.
  - id: DAE-APP-NOT-ON-AGENTS
    because: Use cases reach agents only through interfaces they own, so the application never depends on agent code.
    forbid:
      from:
        layers: [Application]
      to:
        assemblies: ["Daedalus.Agents"]
  - id: DAE-RAGNET-ONLY-IN-AGENTS
    because: Retrieval stays inside the agents layer, so no other layer takes a dependency on Rag.NET.
    allowOnly:
      from:
        layers: [Agents]
      to:
        assemblies: ["Rag.NET*"]
  - id: DAE-SUBAGENT-RUNNER
    because: Only the executor uses the subagent runner directly, and the registered composition code wires it.
    allowOnly:
      from:
        types: ["Daedalus.Application.Agents.SubagentRunExecutor"]
      to:
        types: ["Daedalus.Application.Agents.ISubagentRunner"]
    exceptions:
      - types: ["Daedalus.Infrastructure.Agents.SubagentRunner"]
        because: The runner implements the interface it serves.
      - types: ["Daedalus.Api.Composition.AgentRegistration"]
        because: The composition root creates and registers the runner.
  # The three banned-package rows. Each is scoped to the one project that the broken variant gives the package, in the three ways a
  # package reaches a project: its own reference, a package it references, and a project it references.
  - id: DAE-APP-NO-VALIDATION-LIB
    because: Validation lives in the domain, so the application takes no validation library of its own.
    bannedPackages:
      packages: ["ZeroAlloc.Validation"]
      from:
        assemblies: ["Daedalus.Application"]
  - id: DAE-AGENTS-NO-STATE-MACHINE
    because: Agents keep their state in plain types, so no state machine library comes in, not even through a resilience package.
    bannedPackages:
      packages: ["ZeroAlloc.StateMachine"]
      from:
        assemblies: ["Daedalus.Agents"]
  - id: DAE-DOMAIN-NO-YAML
    because: The domain reads no configuration files, and nothing it references may pull in a YAML library.
    bannedPackages:
      packages: ["YamlDotNet"]
      from:
        assemblies: ["Daedalus.Domain"]
  - id: DAE-API-KEEPS-NO-COPY-OF-DTOS
    because: The web layer maps to its own view models and never copies an application DTO.
    uniqueNames:
      for:
        layers: [WebApi]
      against:
        namespaces: ["Daedalus.Application.**.Dtos"]
