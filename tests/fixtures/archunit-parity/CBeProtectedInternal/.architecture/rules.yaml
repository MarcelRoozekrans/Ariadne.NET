schema: 2
name: parity-c-be-protected-internal
version: "1.0.0"
author: fixture

rules:
  - id: PARITY-CBEPROTECTEDINTERNAL
    because: Mirrors ArchUnitNET's BeProtectedInternal; Broken and Clean must satisfy it.
    require:
      for:
        namespaces: ["Parity.CBeProtectedInternal.Broken", "Parity.CBeProtectedInternal.Clean"]
      is:
        accessibility: ["protected internal"]
  - id: PARITY-CBEPROTECTEDINTERNAL-NOT
    because: Mirrors ArchUnitNET's NotBeProtectedInternal; NotBroken and NotClean must not satisfy it.
    require:
      for:
        namespaces: ["Parity.CBeProtectedInternal.NotBroken", "Parity.CBeProtectedInternal.NotClean"]
      isNot:
        accessibility: ["protected internal"]
