schema: 2
name: parity-s-free-of-cycles
version: "1.0.0"
author: fixture

# The harness compares slices by full namespace, such as Parity.SFreeOfCycles.Broken.Orders: every namespace below Parity.SFreeOfCycles is its own slice.
rules:
  - id: PARITY-SFREEOFCYCLES
    because: Mirrors ArchUnitNET's Slices().Matching("Parity.SFreeOfCycles.(**)").Should().BeFreeOfCycles().
    slices:
      matching: ["Parity.SFreeOfCycles.(**)"]
      freeOfCycles: true
