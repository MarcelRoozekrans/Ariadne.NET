schema: 2
name: parity-p-are-assignable-to
version: "1.0.0"
author: fixture

rules:
  - id: PARITY-PAREASSIGNABLETO
    because: Mirrors ArchUnitNET's AreAssignableTo; the types it selects must not depend on Target.
    forbid:
      from:
        namespaces: ["Parity.PAreAssignableTo.**"]
        assignableTo: ["Parity.PAreAssignableTo.Broken.OrderBase"]
      to:
        namespaces: ["Parity.PAreAssignableTo.Target.**"]
  - id: PARITY-PAREASSIGNABLETO-NOT
    because: Mirrors ArchUnitNET's AreNotAssignableTo; the types it selects must not depend on Target.
    forbid:
      from:
        namespaces: ["Parity.PAreAssignableTo.**"]
      to:
        namespaces: ["Parity.PAreAssignableTo.Target.**"]
    exceptions:
      - assignableTo: ["Parity.PAreAssignableTo.Broken.OrderBase"]
        because: AreNotAssignableTo leaves out OrderBase and its subclasses.
