schema: 2
name: parity-c-have-name-starting-with
version: "1.0.0"
author: fixture

rules:
  - id: PARITY-CHAVENAMESTARTINGWITH
    because: Mirrors ArchUnitNET's HaveNameStartingWith("Order"); Broken and Clean must satisfy it.
    require:
      for:
        namespaces: ["Parity.CHaveNameStartingWith.Broken", "Parity.CHaveNameStartingWith.Clean"]
      is:
        names: ["Order*"]
  - id: PARITY-CHAVENAMESTARTINGWITH-NOT
    because: Mirrors ArchUnitNET's NotHaveNameStartingWith("Order"); NotBroken and NotClean must not satisfy it.
    require:
      for:
        namespaces: ["Parity.CHaveNameStartingWith.NotBroken", "Parity.CHaveNameStartingWith.NotClean"]
      isNot:
        names: ["Order*"]
