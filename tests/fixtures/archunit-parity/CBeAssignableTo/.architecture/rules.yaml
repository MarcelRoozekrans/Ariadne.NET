schema: 2
name: parity-c-be-assignable-to
version: "1.0.0"
author: fixture

rules:
  - id: PARITY-CBEASSIGNABLETO
    because: Mirrors ArchUnitNET's BeAssignableTo; Broken and Clean must satisfy it.
    require:
      for:
        namespaces: ["Parity.CBeAssignableTo.Broken", "Parity.CBeAssignableTo.Clean"]
      is:
        assignableTo: ["Parity.CBeAssignableTo.Target.AuditedBase"]
  - id: PARITY-CBEASSIGNABLETO-NOT
    because: Mirrors ArchUnitNET's NotBeAssignableTo; NotBroken and NotClean must not satisfy it.
    require:
      for:
        namespaces: ["Parity.CBeAssignableTo.NotBroken", "Parity.CBeAssignableTo.NotClean"]
      isNot:
        assignableTo: ["Parity.CBeAssignableTo.Target.AuditedBase"]
