schema: 2
name: parity-p-are-internal
version: "1.0.0"
author: fixture

rules:
  - id: PARITY-PAREINTERNAL
    because: Mirrors ArchUnitNET's AreInternal; the types it selects must not depend on Target.
    forbid:
      from:
        namespaces: ["Parity.PAreInternal.**"]
        accessibility: [internal]
      to:
        namespaces: ["Parity.PAreInternal.Target.**"]
  - id: PARITY-PAREINTERNAL-NOT
    because: Mirrors ArchUnitNET's AreNotInternal; the types it selects must not depend on Target.
    forbid:
      from:
        namespaces: ["Parity.PAreInternal.**"]
        accessibility: [public, protected, private, "protected internal", "private protected"]
      to:
        namespaces: ["Parity.PAreInternal.Target.**"]
