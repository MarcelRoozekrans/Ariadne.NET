schema: 2
name: parity-c-have-full-name
version: "1.0.0"
author: fixture

rules:
  - id: PARITY-CHAVEFULLNAME
    because: Mirrors ArchUnitNET's HaveFullName with Clean.OrderService; Broken and Clean must have that full name.
    require:
      for:
        namespaces: ["Parity.CHaveFullName.Broken", "Parity.CHaveFullName.Clean"]
      is:
        types: ["Parity.CHaveFullName.Clean.OrderService"]
  - id: PARITY-CHAVEFULLNAME-NOT
    because: Mirrors ArchUnitNET's NotHaveFullName with NotBroken.PaymentService; NotBroken and NotClean must not have it.
    require:
      for:
        namespaces: ["Parity.CHaveFullName.NotBroken", "Parity.CHaveFullName.NotClean"]
      isNot:
        types: ["Parity.CHaveFullName.NotBroken.PaymentService"]
