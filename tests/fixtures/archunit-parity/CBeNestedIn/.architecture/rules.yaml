schema: 2
name: parity-c-be-nested-in
version: "1.0.0"
author: fixture

rules:
  - id: PARITY-CBENESTEDIN
    because: Mirrors ArchUnitNET's BeNestedIn with Broken.Order; Broken and Clean must be nested in Order.
    require:
      for:
        namespaces: ["Parity.CBeNestedIn.Broken", "Parity.CBeNestedIn.Clean"]
      is:
        nested: true
        types: ["Parity.CBeNestedIn.Broken.Order.*"]
