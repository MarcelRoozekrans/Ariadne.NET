schema: 2
name: parity-c-be-value-types
version: "1.0.0"
author: fixture

rules:
  - id: PARITY-CBEVALUETYPES
    because: Mirrors ArchUnitNET's BeValueTypes; Broken and Clean must satisfy it.
    require:
      for:
        namespaces: ["Parity.CBeValueTypes.Broken", "Parity.CBeValueTypes.Clean"]
      is:
        kinds: [struct, recordStruct, enum]
  - id: PARITY-CBEVALUETYPES-NOT
    because: Mirrors ArchUnitNET's NotBeValueTypes; NotBroken and NotClean must not satisfy it.
    require:
      for:
        namespaces: ["Parity.CBeValueTypes.NotBroken", "Parity.CBeValueTypes.NotClean"]
      isNot:
        kinds: [struct, recordStruct, enum]
