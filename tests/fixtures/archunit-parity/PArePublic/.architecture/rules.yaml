schema: 2
name: parity-p-are-public
version: "1.0.0"
author: fixture

rules:
  - id: PARITY-PAREPUBLIC
    because: Mirrors ArchUnitNET's ArePublic; the types it selects must not depend on Target.
    forbid:
      from:
        namespaces: ["Parity.PArePublic.**"]
        accessibility: [public]
      to:
        namespaces: ["Parity.PArePublic.Target.**"]
  - id: PARITY-PAREPUBLIC-NOT
    because: Mirrors ArchUnitNET's AreNotPublic; the types it selects must not depend on Target.
    forbid:
      from:
        namespaces: ["Parity.PArePublic.**"]
        accessibility: [internal, protected, private, "protected internal", "private protected"]
      to:
        namespaces: ["Parity.PArePublic.Target.**"]
