schema: 2
name: parity-c-be-record
version: "1.0.0"
author: fixture

rules:
  - id: PARITY-CBERECORD
    because: Mirrors ArchUnitNET's BeRecord on Classes(); Broken and Clean must satisfy it.
    require:
      for:
        namespaces: ["Parity.CBeRecord.Broken", "Parity.CBeRecord.Clean"]
        kinds: [class, record]
      is:
        kinds: [record]
  - id: PARITY-CBERECORD-NOT
    because: Mirrors ArchUnitNET's NotBeRecord on Classes(); NotBroken and NotClean must not satisfy it.
    require:
      for:
        namespaces: ["Parity.CBeRecord.NotBroken", "Parity.CBeRecord.NotClean"]
        kinds: [class, record]
      isNot:
        kinds: [record]
