schema: 2
name: parity-p-have-any-attributes
version: "1.0.0"
author: fixture

rules:
  - id: PARITY-PHAVEANYATTRIBUTES
    because: Mirrors ArchUnitNET's HaveAnyAttributes; the types it selects must not depend on Target.
    forbid:
      from: { attributes: ["Parity.PHaveAnyAttributes.Contracts.AuditedAttribute"] }
      to:
        namespaces: ["Parity.PHaveAnyAttributes.Target.**"]
  - id: PARITY-PHAVEANYATTRIBUTES-NOT
    because: Mirrors ArchUnitNET's DoNotHaveAnyAttributes; the types it selects must not depend on Target.
    forbid:
      from:
        namespaces: ["Parity.PHaveAnyAttributes.**"]
      to:
        namespaces: ["Parity.PHaveAnyAttributes.Target.**"]
    exceptions:
      - attributes: ["Parity.PHaveAnyAttributes.Contracts.AuditedAttribute"]
        because: DoNotHaveAnyAttributes leaves out the types that carry Audited.
