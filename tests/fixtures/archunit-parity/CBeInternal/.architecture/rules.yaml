schema: 2
name: parity-c-be-internal
version: "1.0.0"
author: fixture

rules:
  - id: PARITY-CBEINTERNAL
    because: Mirrors ArchUnitNET's BeInternal; Broken and Clean must be internal.
    require:
      for:
        namespaces: ["Parity.CBeInternal.Broken", "Parity.CBeInternal.Clean"]
      accessibility: internal
  - id: PARITY-CBEINTERNAL-NOT
    because: Mirrors ArchUnitNET's NotBeInternal; NotBroken and NotClean must not be internal.
    require:
      for:
        namespaces: ["Parity.CBeInternal.NotBroken", "Parity.CBeInternal.NotClean"]
      isNot:
        accessibility: [internal]
