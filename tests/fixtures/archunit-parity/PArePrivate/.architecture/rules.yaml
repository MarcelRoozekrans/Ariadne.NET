schema: 2
name: parity-p-are-private
version: "1.0.0"
author: fixture

rules:
  - id: PARITY-PAREPRIVATE
    because: Mirrors ArchUnitNET's ArePrivate; the types it selects must not depend on Target.
    forbid:
      from:
        namespaces: ["Parity.PArePrivate.**"]
        accessibility: [private]
      to:
        namespaces: ["Parity.PArePrivate.Target.**"]
  - id: PARITY-PAREPRIVATE-NOT
    because: Mirrors ArchUnitNET's AreNotPrivate; the types it selects must not depend on Target.
    forbid:
      from:
        namespaces: ["Parity.PArePrivate.**"]
        accessibility: [public, internal, protected, "protected internal", "private protected"]
      to:
        namespaces: ["Parity.PArePrivate.Target.**"]
