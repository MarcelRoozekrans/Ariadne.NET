schema: 2
name: parity-c-implement-interface
version: "1.0.0"
author: fixture

rules:
  - id: PARITY-CIMPLEMENTINTERFACE
    because: Mirrors ArchUnitNET's ImplementInterface condition; Broken and Clean must implement IAuditable.
    require:
      for:
        namespaces: ["Parity.CImplementInterface.Broken", "Parity.CImplementInterface.Clean"]
      is:
        interfaces: ["Parity.CImplementInterface.Target.IAuditable"]
  - id: PARITY-CIMPLEMENTINTERFACE-NOT
    because: Mirrors ArchUnitNET's NotImplementInterface; NotBroken and NotClean must not implement IAuditable.
    require:
      for:
        namespaces: ["Parity.CImplementInterface.NotBroken", "Parity.CImplementInterface.NotClean"]
      isNot:
        interfaces: ["Parity.CImplementInterface.Target.IAuditable"]
