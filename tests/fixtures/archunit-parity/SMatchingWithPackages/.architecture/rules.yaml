# No rule yet: a pack cannot group types into slices. Phase 4.3 adds PARITY-SMATCHINGWITHPACKAGES here, a slices rule with independent: true, and deletes its KnownGaps entry.
# The harness compares slices by full namespace, such as Parity.SMatchingWithPackages.Broken.Orders: every namespace below Parity.SMatchingWithPackages is its own slice.
# MatchingWithPackages and Matching cut the same slices here and differ only in how ArchUnitNET names them: by full namespace, or by the captured remainder.
