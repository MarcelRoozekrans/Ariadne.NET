schema: 2
name: parity-c-be-public
version: "1.0.0"
author: fixture

rules:
  - id: PARITY-CBEPUBLIC
    because: Mirrors ArchUnitNET's BePublic; Broken and Clean must satisfy it.
    require:
      for:
        namespaces: ["Parity.CBePublic.Broken", "Parity.CBePublic.Clean"]
      is:
        accessibility: [public]
  - id: PARITY-CBEPUBLIC-NOT
    because: Mirrors ArchUnitNET's NotBePublic; NotBroken and NotClean must not satisfy it.
    require:
      for:
        namespaces: ["Parity.CBePublic.NotBroken", "Parity.CBePublic.NotClean"]
      isNot:
        accessibility: [public]
