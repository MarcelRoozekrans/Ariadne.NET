schema: 2
name: parity-c-be-structs
version: "1.0.0"
author: fixture

rules:
  - id: PARITY-CBESTRUCTS
    because: Mirrors ArchUnitNET's BeStructs; Broken and Clean must satisfy it.
    require:
      for:
        namespaces: ["Parity.CBeStructs.Broken", "Parity.CBeStructs.Clean"]
      is:
        kinds: [struct, recordStruct]
  - id: PARITY-CBESTRUCTS-NOT
    because: Mirrors ArchUnitNET's NotBeStructs; NotBroken and NotClean must not satisfy it.
    require:
      for:
        namespaces: ["Parity.CBeStructs.NotBroken", "Parity.CBeStructs.NotClean"]
      isNot:
        kinds: [struct, recordStruct]
