schema: 2
name: parity-c-have-full-name-containing
version: "1.0.0"
author: fixture

rules:
  - id: PARITY-CHAVEFULLNAMECONTAINING
    because: Mirrors ArchUnitNET's HaveFullNameContaining with Order; Broken and Clean must contain it.
    require:
      for:
        namespaces: ["Parity.CHaveFullNameContaining.Broken", "Parity.CHaveFullNameContaining.Clean"]
      is:
        types: ["**.*Order*.**"]
  - id: PARITY-CHAVEFULLNAMECONTAINING-NOT
    because: Mirrors ArchUnitNET's NotHaveFullNameContaining with NotBroken.Pay, which spans a dot; NotBroken and NotClean must not contain it.
    require:
      for:
        namespaces: ["Parity.CHaveFullNameContaining.NotBroken", "Parity.CHaveFullNameContaining.NotClean"]
      isNot:
        types: ["**.*NotBroken.Pay*.**"]
