schema: 2
name: parity-c-have-name-ending-with
version: "1.0.0"
author: fixture

rules:
  - id: PARITY-CHAVENAMEENDINGWITH
    because: Mirrors ArchUnitNET's HaveNameEndingWith("Service"); Broken and Clean must satisfy it.
    require:
      for:
        namespaces: ["Parity.CHaveNameEndingWith.Broken", "Parity.CHaveNameEndingWith.Clean"]
      is:
        names: ["*Service"]
  - id: PARITY-CHAVENAMEENDINGWITH-NOT
    because: Mirrors ArchUnitNET's NotHaveNameEndingWith("Service"); NotBroken and NotClean must not satisfy it.
    require:
      for:
        namespaces: ["Parity.CHaveNameEndingWith.NotBroken", "Parity.CHaveNameEndingWith.NotClean"]
      isNot:
        names: ["*Service"]
