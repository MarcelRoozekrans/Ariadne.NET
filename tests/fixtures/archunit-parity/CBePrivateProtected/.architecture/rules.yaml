schema: 2
name: parity-c-be-private-protected
version: "1.0.0"
author: fixture

rules:
  - id: PARITY-CBEPRIVATEPROTECTED
    because: Mirrors ArchUnitNET's BePrivateProtected; Broken and Clean must satisfy it.
    require:
      for:
        namespaces: ["Parity.CBePrivateProtected.Broken", "Parity.CBePrivateProtected.Clean"]
      is:
        accessibility: ["private protected"]
  - id: PARITY-CBEPRIVATEPROTECTED-NOT
    because: Mirrors ArchUnitNET's NotBePrivateProtected; NotBroken and NotClean must not satisfy it.
    require:
      for:
        namespaces: ["Parity.CBePrivateProtected.NotBroken", "Parity.CBePrivateProtected.NotClean"]
      isNot:
        accessibility: ["private protected"]
