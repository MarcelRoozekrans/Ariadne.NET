schema: 2
name: parity-p-are-protected
version: "1.0.0"
author: fixture

rules:
  - id: PARITY-PAREPROTECTED
    because: Mirrors ArchUnitNET's AreProtected; the types it selects must not depend on Target.
    forbid:
      from:
        namespaces: ["Parity.PAreProtected.**"]
        accessibility: [protected]
      to:
        namespaces: ["Parity.PAreProtected.Target.**"]
  - id: PARITY-PAREPROTECTED-NOT
    because: Mirrors ArchUnitNET's AreNotProtected; the types it selects must not depend on Target.
    forbid:
      from:
        namespaces: ["Parity.PAreProtected.**"]
        accessibility: [public, internal, private, "protected internal", "private protected"]
      to:
        namespaces: ["Parity.PAreProtected.Target.**"]
