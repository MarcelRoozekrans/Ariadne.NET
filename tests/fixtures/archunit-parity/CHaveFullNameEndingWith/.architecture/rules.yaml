schema: 2
name: parity-c-have-full-name-ending-with
version: "1.0.0"
author: fixture

rules:
  - id: PARITY-CHAVEFULLNAMEENDINGWITH
    because: Mirrors ArchUnitNET's HaveFullNameEndingWith with Service; Broken and Clean must end with it.
    require:
      for:
        namespaces: ["Parity.CHaveFullNameEndingWith.Broken", "Parity.CHaveFullNameEndingWith.Clean"]
      is:
        types: ["**.*Service"]
  - id: PARITY-CHAVEFULLNAMEENDINGWITH-NOT
    because: Mirrors ArchUnitNET's NotHaveFullNameEndingWith with Broken.PaymentService; NotBroken and NotClean must not end with it.
    require:
      for:
        namespaces: ["Parity.CHaveFullNameEndingWith.NotBroken", "Parity.CHaveFullNameEndingWith.NotClean"]
      isNot:
        types: ["**.*Broken.PaymentService"]
