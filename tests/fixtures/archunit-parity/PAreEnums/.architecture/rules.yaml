schema: 2
name: parity-p-are-enums
version: "1.0.0"
author: fixture

rules:
  - id: PARITY-PAREENUMS
    because: Mirrors ArchUnitNET's AreEnums; the types it selects must not depend on Target.
    forbid:
      from:
        namespaces: ["Parity.PAreEnums.**"]
        kinds: [enum]
      to:
        namespaces: ["Parity.PAreEnums.Target.**"]
  - id: PARITY-PAREENUMS-NOT
    because: Mirrors ArchUnitNET's AreNotEnums; the types it selects must not depend on Target.
    forbid:
      from:
        namespaces: ["Parity.PAreEnums.**"]
        kinds: [class, interface, record, struct, recordStruct, delegate]
      to:
        namespaces: ["Parity.PAreEnums.Target.**"]
