schema: 2
name: parity-p-attribute-are-abstract
version: "1.0.0"
author: fixture

rules:
  - id: PARITY-PATTRIBUTEAREABSTRACT
    because: Mirrors ArchUnitNET's AreAbstract on Attributes(); the types it selects must not depend on Target.
    forbid:
      from:
        namespaces: ["Parity.PAttributeAreAbstract.**"]
        assignableTo: ["System.Attribute"]
        abstract: true
      to:
        namespaces: ["Parity.PAttributeAreAbstract.Target.**"]
  - id: PARITY-PATTRIBUTEAREABSTRACT-NOT
    because: Mirrors ArchUnitNET's AreNotAbstract on Attributes(); the types it selects must not depend on Target.
    forbid:
      from:
        namespaces: ["Parity.PAttributeAreAbstract.**"]
        assignableTo: ["System.Attribute"]
        abstract: false
      to:
        namespaces: ["Parity.PAttributeAreAbstract.Target.**"]
