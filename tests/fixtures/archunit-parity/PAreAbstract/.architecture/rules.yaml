schema: 2
name: parity-p-are-abstract
version: "1.0.0"
author: fixture

rules:
  - id: PARITY-PAREABSTRACT
    because: Mirrors ArchUnitNET's AreAbstract on Classes(); the types it selects must not depend on Target.
    forbid:
      from:
        namespaces: ["Parity.PAreAbstract.**"]
        kinds: [class, record]
        abstract: true
      to:
        namespaces: ["Parity.PAreAbstract.Target.**"]
  - id: PARITY-PAREABSTRACT-NOT
    because: Mirrors ArchUnitNET's AreNotAbstract on Classes(); the types it selects must not depend on Target.
    forbid:
      from:
        namespaces: ["Parity.PAreAbstract.**"]
        kinds: [class, record]
        abstract: false
      to:
        namespaces: ["Parity.PAreAbstract.Target.**"]
