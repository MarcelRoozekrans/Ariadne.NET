schema: 2
name: parity-c-be
version: "1.0.0"
author: fixture

rules:
  - id: PARITY-CBE
    because: Mirrors ArchUnitNET's Be with Clean.Ledger and Clean.InvoiceService; Broken and Clean must be one of them.
    require:
      for:
        namespaces: ["Parity.CBe.Broken", "Parity.CBe.Clean"]
      is:
        types: ["Parity.CBe.Clean.Ledger", "Parity.CBe.Clean.InvoiceService"]
  - id: PARITY-CBE-NOT
    because: Mirrors ArchUnitNET's NotBe with NotBroken.Shipment; NotBroken and NotClean must not be it.
    require:
      for:
        namespaces: ["Parity.CBe.NotBroken", "Parity.CBe.NotClean"]
      isNot:
        types: ["Parity.CBe.NotBroken.Shipment"]
