schema: 2
name: parity-p-are-structs
version: "1.0.0"
author: fixture

rules:
  - id: PARITY-PARESTRUCTS
    because: Mirrors ArchUnitNET's AreStructs; the types it selects must not depend on Target.
    forbid:
      from:
        namespaces: ["Parity.PAreStructs.**"]
        kinds: [struct, recordStruct]
      to:
        namespaces: ["Parity.PAreStructs.Target.**"]
  - id: PARITY-PARESTRUCTS-NOT
    because: Mirrors ArchUnitNET's AreNotStructs; the types it selects must not depend on Target.
    forbid:
      from:
        namespaces: ["Parity.PAreStructs.**"]
        kinds: [class, interface, record, enum, delegate]
      to:
        namespaces: ["Parity.PAreStructs.Target.**"]
