schema: 2
name: parity-p-are-nested
version: "1.0.0"
author: fixture

rules:
  - id: PARITY-PARENESTED
    because: Mirrors ArchUnitNET's AreNested; the types it selects must not depend on Target.
    forbid:
      from:
        namespaces: ["Parity.PAreNested.**"]
        nested: true
      to:
        namespaces: ["Parity.PAreNested.Target.**"]
  - id: PARITY-PARENESTED-NOT
    because: Mirrors ArchUnitNET's AreNotNested; the types it selects must not depend on Target.
    forbid:
      from:
        namespaces: ["Parity.PAreNested.**"]
        nested: false
      to:
        namespaces: ["Parity.PAreNested.Target.**"]
