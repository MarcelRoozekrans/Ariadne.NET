schema: 2
name: parity-s-not-depend-on-each-other
version: "1.0.0"
author: fixture

# The harness compares slices by full namespace, such as Parity.SNotDependOnEachOther.Broken.Orders: every namespace below Parity.SNotDependOnEachOther is its own slice.
# Broken.Orders.Internal is a slice of its own under (**), as under ArchUnitNET, so Broken.Orders depending on it is a violation.
rules:
  - id: PARITY-SNOTDEPENDONEACHOTHER
    because: Mirrors ArchUnitNET's Slices().Matching("Parity.SNotDependOnEachOther.(**)").Should().NotDependOnEachOther().
    slices:
      matching: ["Parity.SNotDependOnEachOther.(**)"]
      independent: true
