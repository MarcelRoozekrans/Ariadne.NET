schema: 2
name: x
layers:
  - name: Domain
    id: X-L-DOMAIN
    because: core
    namespaces: ["**.Domain.**"]
  - name: Web
    id: X-L-WEB
    because: edge
    namespaces: ["**.Web.**"]
    allowedDependencies: [Domain]
rules:
  - id: X-R1
    because: b
    forbid:
      from:
        attributeArguments:
          - attribute: "**.RouteAttribute"
            arguments: ["api/orders", 2, true, 1.5]
            named: { Name: orders, Order: 3, Strict: false }
          - arguments: [Read]
          - named: { Version: "1.0" }
      to: { namespaces: ["**.Persistence.**"] }
    exceptions:
      - attributeArguments:
          - attribute: "**.AuditedAttribute"
            named: { Level: 2 }
        because: audited types may use persistence
  - id: X-R2
    because: b
    require:
      for: { layers: [Web] }
      is: { attributeArguments: [{ arguments: [Web] }] }
      isNot: { attributeArguments: [{ named: { Legacy: true } }] }
