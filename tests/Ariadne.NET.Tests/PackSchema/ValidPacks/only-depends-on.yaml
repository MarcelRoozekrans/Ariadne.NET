schema: 2
name: x
layers:
  - name: Domain
    id: X-L-DOMAIN
    because: core
    namespaces: ["**.Domain.**"]
  - name: Web
    id: X-L-WEB
    because: edge
    namespaces: ["**.Web.**"]
    allowedDependencies: [Domain]
rules:
  - id: X-R1
    because: b
    forbid:
      from: { layers: [Web], onlyDependsOn: { namespaces: ["System.Data.**"], sealed: true } }
      to: { namespaces: ["**.Persistence.**"] }
    exceptions:
      - onlyDependsOn: { layers: [Domain], kinds: [interface] }
        because: domain users may use persistence
      - onlyDependsOn: { types: ["**.Clock"], attributes: ["**.A"] }
        because: x
  - id: X-R2
    because: b
    require:
      for: { namespaces: ["Shop.**"] }
      is: { onlyDependsOn: { layers: [Domain] } }
      isNot: { onlyDependsOn: { assemblies: ["Legacy.*"], interfaces: ["**.IA"], onlyAttributes: ["**.B"] } }
  - id: X-R3
    because: b
    uniqueNames:
      for: { layers: [Web], onlyDependsOn: { layers: [Domain] } }
      against: { namespaces: ["Shop.**"], onlyDependsOn: { baseTypes: ["**.Base"] } }
