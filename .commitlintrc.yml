extends:
  - "@commitlint/config-conventional"

rules:
  type-enum:
    - 2
    - always
    - - feat
      - fix
      - deps
      - docs
      - style
      - refactor
      - perf
      - test
      - build
      - ci
      - chore
      - revert

  subject-case:
    - 2
    - never
    - - sentence-case
      - start-case
      - pascal-case
      - upper-case

  header-max-length:
    - 2
    - always
    - 100

  # Off: a wrapped commit body is style, nothing downstream parses its line length, and the history already exceeds 100.
  body-max-line-length:
    - 0
    - always
    - 100
