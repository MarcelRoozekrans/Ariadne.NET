schema: 2
name: modular-monolith
version: "1.1.0"
author: platform-team

layers:
  - name: Module.Public
    id: MM-LAYER-PUBLIC
    because: A module's public API is what other modules may see, so it depends on nothing internal.
    namespaces: ["**.Public.**"]
    description: "Public module API (contracts)"
    allowedDependencies: []
  - name: Module.Core
    id: MM-LAYER-CORE
    because: A module's core implements its public API and stays hidden from other modules.
    namespaces: ["**.Core.**"]
    description: "Internal module implementation"
    allowedDependencies:
      - Module.Public
  - name: Module.Infrastructure
    id: MM-LAYER-INFRASTRUCTURE
    because: A module's infrastructure serves its core and public API without leaking into other modules.
    namespaces: ["**.Infrastructure.**"]
    description: "Module infrastructure"
    allowedDependencies:
      - Module.Public
      - Module.Core
  - name: Host
    id: MM-LAYER-HOST
    because: The host is the composition root that wires every module together.
    namespaces: ["**.Host.**"]
    description: "Composition root"
    allowedDependencies:
      - Module.Public
      - Module.Core
      - Module.Infrastructure

rules:
  - id: MM-MODULES-INDEPENDENT
    because: A module may use another module only through that module's public API.
    allowEmpty: true
    slices:
      matching: ["**.(*).Public.**", "**.(*).Core.**", "**.(*).Infrastructure.**"]
      independent: true
      allow: { layers: [Module.Public] }

componentRoles:
  - name: ModuleContract
    layer: Module.Public
    allowEmpty: true
    typeKind: Interface
    requiresInterface: false
    description: "Public module interface"
  - name: ModuleEvent
    layer: Module.Public
    allowEmpty: true
    typeKind: Record
    requiresInterface: false
    description: "Inter-module event"
  - name: ModuleDto
    layer: Module.Public
    allowEmpty: true
    typeKind: Record
    requiresInterface: false
    description: "Public DTO"
  - name: ModuleService
    layer: Module.Core
    allowEmpty: true
    typeKind: Class
    requiresInterface: true
    interfaceRole: ModuleContract
    accessibility: internal
    description: "Module implementation"
  - name: ModuleEntity
    layer: Module.Core
    allowEmpty: true
    typeKind: Class
    requiresInterface: false
    description: "Internal entity"
  - name: ModuleRepository
    layer: Module.Infrastructure
    allowEmpty: true
    typeKind: Class
    requiresInterface: true
    interfaceRole: ModuleRepositoryInterface
    accessibility: internal
    description: "Data access"
  - name: ModuleRepositoryInterface
    layer: Module.Core
    allowEmpty: true
    typeKind: Interface
    requiresInterface: false
    alternativeNames: [ModuleRepository, Repository]
    description: "Repository contract"
  - name: ModuleRegistration
    layer: Host
    allowEmpty: true
    typeKind: Class
    requiresInterface: false
    description: "DI registration for module"

namingConventions:
  namespace: "{SolutionName}.{Feature}.{Layer}"
  filePath: "src/{SolutionName}.{Feature}.{Layer}/{ComponentName}.cs"
