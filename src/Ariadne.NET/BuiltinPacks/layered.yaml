schema: 2
name: layered
version: "1.0.0"
author: platform-team

layers:
  - name: Presentation
    id: LAY-LAYER-PRESENTATION
    because: Presentation talks to the business layer only, never straight to data access.
    namespaces: ["**.Presentation.**"]
    description: "UI, API controllers, view models"
    allowedDependencies:
      - Business
  - name: Business
    id: LAY-LAYER-BUSINESS
    because: Business logic sits between presentation and data and calls only the layer below it.
    namespaces: ["**.Business.**"]
    description: "Business logic, services, validation"
    allowedDependencies:
      - DataAccess
  - name: DataAccess
    id: LAY-LAYER-DATAACCESS
    because: Data access is the bottom layer and depends on no other layer.
    namespaces: ["**.DataAccess.**"]
    description: "Repositories, database context, data models"
    allowedDependencies: []

componentRoles:
  - name: Controller
    layer: Presentation
    allowEmpty: true
    typeKind: Class
    requiresInterface: false
    description: "API controller or MVC controller"
  - name: ViewModel
    layer: Presentation
    allowEmpty: true
    typeKind: Class
    requiresInterface: false
    description: "View model for UI binding"
  - name: ApiModel
    layer: Presentation
    allowEmpty: true
    typeKind: Record
    requiresInterface: false
    description: "API request/response model"
  - name: Service
    layer: Business
    allowEmpty: true
    typeKind: Class
    requiresInterface: true
    interfaceRole: ServiceInterface
    description: "Business service"
  - name: ServiceInterface
    layer: Business
    allowEmpty: true
    typeKind: Interface
    requiresInterface: false
    alternativeNames: [Service]
    description: "Business service contract"
  - name: Validator
    layer: Business
    allowEmpty: true
    typeKind: Class
    requiresInterface: false
    description: "Input validator"
  - name: BusinessModel
    layer: Business
    allowEmpty: true
    typeKind: Class
    requiresInterface: false
    description: "Business domain model"
  - name: Repository
    layer: DataAccess
    allowEmpty: true
    typeKind: Class
    requiresInterface: true
    interfaceRole: RepositoryInterface
    description: "Data access repository"
  - name: RepositoryInterface
    layer: DataAccess
    allowEmpty: true
    typeKind: Interface
    requiresInterface: false
    alternativeNames: [Repository]
    description: "Repository contract"
  - name: DbContext
    layer: DataAccess
    allowEmpty: true
    typeKind: Class
    requiresInterface: false
    description: "Database context"
  - name: DataModel
    layer: DataAccess
    allowEmpty: true
    typeKind: Class
    requiresInterface: false
    description: "Database entity / data model"

namingConventions:
  namespace: "{SolutionName}.{Feature}.{Layer}"
  filePath: "src/{SolutionName}.{Feature}.{Layer}/{ComponentName}.cs"
