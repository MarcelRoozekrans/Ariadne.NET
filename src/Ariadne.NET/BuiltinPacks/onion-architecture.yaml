schema: 2
name: onion-architecture
version: "1.0.0"
author: platform-team

layers:
  - name: DomainModel
    id: ONION-LAYER-DOMAINMODEL
    because: The domain model is the centre of the onion and depends on no other layer.
    namespaces: ["**.DomainModel.**"]
    description: "Entities, value objects, domain enums"
    allowedDependencies: []
  - name: DomainServices
    id: ONION-LAYER-DOMAINSERVICES
    because: Domain services and repository contracts wrap the domain model and depend only on it.
    namespaces: ["**.DomainServices.**"]
    description: "Domain service interfaces, repository contracts, domain events"
    allowedDependencies:
      - DomainModel
  - name: ApplicationServices
    id: ONION-LAYER-APPLICATIONSERVICES
    because: Application services orchestrate the domain rings and depend only on layers further in.
    namespaces: ["**.ApplicationServices.**"]
    description: "Use cases, orchestration, application-level interfaces"
    allowedDependencies:
      - DomainModel
      - DomainServices
  - name: Infrastructure
    id: ONION-LAYER-INFRASTRUCTURE
    because: Infrastructure is an outer ring that implements the contracts of the inner rings.
    namespaces: ["**.Infrastructure.**"]
    description: "Persistence, external services, messaging"
    allowedDependencies:
      - DomainModel
      - DomainServices
      - ApplicationServices
  - name: Presentation
    id: ONION-LAYER-PRESENTATION
    because: Presentation is an outer ring that uses the inner rings and never depends on infrastructure.
    namespaces: ["**.Presentation.**"]
    description: "API controllers, UI, view models"
    allowedDependencies:
      - DomainModel
      - DomainServices
      - ApplicationServices

componentRoles:
  - name: Entity
    layer: DomainModel
    typeKind: Class
    requiresInterface: false
    description: "Domain entity with identity"
  - name: ValueObject
    layer: DomainModel
    typeKind: Class
    requiresInterface: false
    description: "Immutable value type"
  - name: DomainEnum
    layer: DomainModel
    typeKind: Class
    requiresInterface: false
    description: "Enumeration class"
  - name: RepositoryInterface
    layer: DomainServices
    typeKind: Interface
    requiresInterface: false
    alternativeNames: [Repository]
    description: "Repository contract (defined in DomainServices)"
  - name: DomainServiceInterface
    layer: DomainServices
    typeKind: Interface
    requiresInterface: false
    alternativeNames: [DomainService]
    description: "Domain service contract"
  - name: DomainEvent
    layer: DomainServices
    typeKind: Record
    requiresInterface: false
    description: "Domain event"
  - name: ApplicationService
    layer: ApplicationServices
    typeKind: Class
    requiresInterface: true
    interfaceRole: ApplicationServiceInterface
    description: "Application use case orchestrator"
  - name: ApplicationServiceInterface
    layer: ApplicationServices
    typeKind: Interface
    requiresInterface: false
    alternativeNames: [ApplicationService]
    description: "Application service contract"
  - name: Dto
    layer: ApplicationServices
    typeKind: Record
    requiresInterface: false
    description: "Data transfer object"
  - name: Repository
    layer: Infrastructure
    typeKind: Class
    requiresInterface: true
    interfaceRole: RepositoryInterface
    accessibility: internal
    description: "Repository implementation"
  - name: DomainService
    layer: Infrastructure
    typeKind: Class
    requiresInterface: true
    interfaceRole: DomainServiceInterface
    accessibility: internal
    description: "Domain service implementation"
  - name: DbContext
    layer: Infrastructure
    typeKind: Class
    requiresInterface: false
    description: "Database context"
  - name: Controller
    layer: Presentation
    typeKind: Class
    requiresInterface: false
    description: "API controller"
  - name: ViewModel
    layer: Presentation
    typeKind: Class
    requiresInterface: false
    description: "View model for UI binding"

namingConventions:
  namespace: "{SolutionName}.{Feature}.{Layer}"
  filePath: "src/{SolutionName}.{Feature}.{Layer}/{ComponentName}.cs"
