schema: 2
name: event-driven
version: "1.0.0"
author: platform-team

layers:
  - name: Domain
    id: ED-LAYER-DOMAIN
    because: The domain model holds the business rules and knows nothing about messaging.
    namespaces: ["**.Domain.**"]
    description: "Core domain model"
    allowedDependencies: []
  - name: Events
    id: ED-LAYER-EVENTS
    because: Events describe what happened in the domain, so they may refer only to the domain.
    namespaces: ["**.Events.**"]
    description: "Event definitions"
    allowedDependencies:
      - Domain
  - name: Producers
    id: ED-LAYER-PRODUCERS
    because: Producers publish events about the domain and must not know who consumes them.
    namespaces: ["**.Producers.**"]
    description: "Event publishers"
    allowedDependencies:
      - Domain
      - Events
  - name: Consumers
    id: ED-LAYER-CONSUMERS
    because: Consumers react to events and must not call producers directly, which keeps the flow one-way.
    namespaces: ["**.Consumers.**"]
    description: "Event handlers/subscribers"
    allowedDependencies:
      - Domain
      - Events
  - name: Infrastructure
    id: ED-LAYER-INFRASTRUCTURE
    because: Messaging infrastructure wires producers and consumers to the broker, so it sees every layer.
    namespaces: ["**.Infrastructure.**"]
    description: "Messaging infrastructure"
    allowedDependencies:
      - Domain
      - Events
      - Producers
      - Consumers

componentRoles:
  - name: Event
    layer: Events
    typeKind: Record
    requiresInterface: false
    description: "Event message"
  - name: IntegrationEvent
    layer: Events
    typeKind: Record
    requiresInterface: false
    description: "Cross-boundary event"
  - name: EventProducer
    layer: Producers
    typeKind: Class
    requiresInterface: true
    interfaceRole: EventProducerInterface
    description: "Publishes events"
  - name: EventProducerInterface
    layer: Producers
    typeKind: Interface
    requiresInterface: false
    description: "Interface for event producer"
  - name: EventConsumer
    layer: Consumers
    typeKind: Class
    requiresInterface: true
    interfaceRole: EventConsumerInterface
    description: "Handles events"
  - name: EventConsumerInterface
    layer: Consumers
    typeKind: Interface
    requiresInterface: false
    description: "Interface for event consumer"
  - name: EventHandler
    layer: Consumers
    typeKind: Class
    requiresInterface: false
    description: "Alias for consumer"
  - name: MessageBrokerAdapter
    layer: Infrastructure
    typeKind: Class
    requiresInterface: true
    interfaceRole: MessageBrokerInterface
    accessibility: internal
    description: "Broker implementation"
  - name: MessageBrokerInterface
    layer: Infrastructure
    typeKind: Interface
    requiresInterface: false
    description: "Broker contract"

namingConventions:
  namespace: "{SolutionName}.{Feature}.{Layer}"
  filePath: "src/{SolutionName}.{Feature}.{Layer}/{ComponentName}.cs"
