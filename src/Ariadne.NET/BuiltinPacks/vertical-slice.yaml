schema: 2
name: vertical-slice
version: "1.0.0"
author: platform-team

layers:
  - name: Feature
    id: VS-LAYER-FEATURE
    because: Each feature slice is self-contained and must not depend on another layer.
    namespaces: ["**.Feature.**"]
    description: "Each feature is self-contained"
    allowedDependencies: []
  - name: SharedKernel
    id: VS-LAYER-SHAREDKERNEL
    because: The shared kernel holds the few types every slice needs and depends on nothing else.
    namespaces: ["**.SharedKernel.**"]
    description: "Shared types across features"
    allowedDependencies: []
  - name: Infrastructure
    id: VS-LAYER-INFRASTRUCTURE
    because: Cross-cutting infrastructure serves the features and the shared kernel.
    namespaces: ["**.Infrastructure.**"]
    description: "Cross-cutting infrastructure"
    allowedDependencies:
      - Feature
      - SharedKernel

componentRoles:
  - name: Request
    layer: Feature
    allowEmpty: true
    typeKind: Record
    requiresInterface: false
    description: "Incoming request/command"
  - name: Response
    layer: Feature
    allowEmpty: true
    typeKind: Record
    requiresInterface: false
    description: "Outgoing response/result"
  - name: Handler
    layer: Feature
    allowEmpty: true
    typeKind: Class
    requiresInterface: false
    description: "Handles the request"
  - name: Validator
    layer: Feature
    allowEmpty: true
    typeKind: Class
    requiresInterface: false
    description: "Validates input"
  - name: Endpoint
    layer: Feature
    allowEmpty: true
    typeKind: Class
    requiresInterface: false
    description: "API endpoint/controller"
  - name: SharedEntity
    layer: SharedKernel
    allowEmpty: true
    typeKind: Class
    requiresInterface: false
    description: "Shared domain entity"
  - name: SharedDto
    layer: SharedKernel
    allowEmpty: true
    typeKind: Record
    requiresInterface: false
    description: "Shared DTO"
  - name: DbContext
    layer: Infrastructure
    allowEmpty: true
    typeKind: Class
    requiresInterface: false
    description: "Database context"

namingConventions:
  namespace: "{SolutionName}.{Feature}.{Layer}"
  filePath: "src/{SolutionName}.{Feature}.{Layer}/{ComponentName}.cs"
