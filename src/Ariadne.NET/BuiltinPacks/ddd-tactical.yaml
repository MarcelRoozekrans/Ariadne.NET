name: ddd-tactical
version: "1.0.0"
author: platform-team

componentRoles:
  - name: Aggregate
    layer: Domain
    typeKind: Class
    requiresInterface: false
    description: "Aggregate root entity"
  - name: AggregateRoot
    layer: Domain
    typeKind: Class
    requiresInterface: false
    description: "Alias for Aggregate"
  - name: ValueObject
    layer: Domain
    typeKind: Record
    requiresInterface: false
    description: "Immutable value type"
  - name: DomainEvent
    layer: Domain
    typeKind: Record
    requiresInterface: false
    description: "Domain event"
  - name: DomainService
    layer: Domain
    typeKind: Class
    requiresInterface: true
    interfaceRole: DomainServiceInterface
    description: "Domain service"
  - name: DomainServiceInterface
    layer: Domain
    typeKind: Interface
    requiresInterface: false
    description: "Interface for domain service"
  - name: Specification
    layer: Domain
    typeKind: Class
    requiresInterface: false
    description: "Query specification"
  - name: Factory
    layer: Domain
    typeKind: Class
    requiresInterface: false
    description: "Entity/aggregate factory"
  - name: DomainException
    layer: Domain
    typeKind: Class
    requiresInterface: false
    description: "Domain-specific exception"

namingConventions:
  namespace: "{SolutionName}.{Feature}.{Layer}"
  filePath: "src/{SolutionName}.{Feature}.{Layer}/{ComponentName}.cs"
