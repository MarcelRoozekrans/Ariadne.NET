name: modular-monolith
version: "1.0.0"
author: platform-team

layers:
  - name: Module.Public
    description: "Public module API (contracts)"
    allowedDependencies: []
  - name: Module.Core
    description: "Internal module implementation"
    allowedDependencies:
      - Module.Public
  - name: Module.Infrastructure
    description: "Module infrastructure"
    allowedDependencies:
      - Module.Public
      - Module.Core
  - name: Host
    description: "Composition root"
    allowedDependencies:
      - Module.Public
      - Module.Core
      - Module.Infrastructure

componentRoles:
  - name: ModuleContract
    layer: Module.Public
    typeKind: Interface
    requiresInterface: false
    description: "Public module interface"
  - name: ModuleEvent
    layer: Module.Public
    typeKind: Record
    requiresInterface: false
    description: "Inter-module event"
  - name: ModuleDto
    layer: Module.Public
    typeKind: Record
    requiresInterface: false
    description: "Public DTO"
  - name: ModuleService
    layer: Module.Core
    typeKind: Class
    requiresInterface: true
    interfaceRole: ModuleContract
    accessibility: internal
    description: "Module implementation"
  - name: ModuleEntity
    layer: Module.Core
    typeKind: Class
    requiresInterface: false
    description: "Internal entity"
  - name: ModuleRepository
    layer: Module.Infrastructure
    typeKind: Class
    requiresInterface: true
    interfaceRole: ModuleRepositoryInterface
    accessibility: internal
    description: "Data access"
  - name: ModuleRepositoryInterface
    layer: Module.Core
    typeKind: Interface
    requiresInterface: false
    alternativeNames: [ModuleRepository, Repository]
    description: "Repository contract"
  - name: ModuleRegistration
    layer: Host
    typeKind: Class
    requiresInterface: false
    description: "DI registration for module"

namingConventions:
  namespace: "{SolutionName}.{Feature}.{Layer}"
  filePath: "src/{SolutionName}.{Feature}.{Layer}/{ComponentName}.cs"
