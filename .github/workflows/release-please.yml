name: Release Please

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

# The release PR is written with a token from the release bot GitHub App, not the built-in GITHUB_TOKEN. GitHub starts
# no workflow from an event GITHUB_TOKEN creates, so with it the release PR would get no CI of its own. Pushes made with
# the App token raise ordinary pull_request events, so ci.yml runs on the release PR like on any other. The App key is a
# stored credential, but it never expires and acts as no person; it needs the RELEASE_BOT_CLIENT_ID variable and the
# RELEASE_BOT_PRIVATE_KEY secret.
jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Mint a release bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Starts the nuget.org publish for a release. ci.yml has no tag or release trigger, so the publish run is started here,
  # on the tag, by dispatch.
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Dispatch the publish run on the release tag
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f publish_to_nuget=true
