name: history-scan

# Full-history secret scan, for reruns from main. The pre-public scan was run locally, not through this workflow.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  history-scan:
    uses: MarcelRoozekrans/ci-baseline/.github/workflows/history-scan.yml@v1
    secrets:
      GITLEAKS_CONFIG: ${{ secrets.GITLEAKS_CONFIG }}
