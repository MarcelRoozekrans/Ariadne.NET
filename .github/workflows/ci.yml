name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/ArchGov.slnx

      - name: Build
        run: dotnet build src/ArchGov.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test src/ArchGov.slnx --configuration Release --no-build --verbosity normal

      - name: Pack (verify)
        run: dotnet pack src/ArchGov.slnx --configuration Release --no-build --output ./artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: ./artifacts/*.nupkg
