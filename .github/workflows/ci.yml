name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish_to_nuget:
        description: Push the release packages to nuget.org. Only takes effect on a v* tag; see RELEASING.md
        type: boolean
        default: false
      resume:
        description: Finish a publish that died partway, skipping the packages already on nuget.org; see RELEASING.md
        type: boolean
        default: false

# A newer push to the same branch or pull request makes the running workflow irrelevant, so it is cancelled. A dispatch
# never cancels a running one, and a publish dispatch runs on its tag ref, which no push or pull request run shares, so
# nothing cancels a publish halfway: that would leave some packages on nuget.org and others not, and nuget.org cannot
# take them back.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  # Builds and tests on Linux and Windows. fail-fast is off so both legs always finish: the two platforms fail for
  # different reasons, and cancelling the Windows leg the moment Linux goes red hides the failure only Windows shows.
  # Coverage is measured on the Linux leg only, because ci-baseline's coverage gate runs on Linux runners only.
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    permissions:
      contents: read
      id-token: write   # Codecov upload via OIDC, no token secret

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore src/Ariadne.NET.slnx

      - name: Build
        run: dotnet build src/Ariadne.NET.slnx --no-restore -c Release

      - name: Test
        run: dotnet test src/Ariadne.NET.slnx --no-build -c Release --collect:"XPlat Code Coverage" --results-directory ./test-results

      # Checks this repository against its own v2 rule pack in .architecture/rules.yaml.
      - name: Validate architecture
        run: dotnet run --project src/Ariadne.NET.Cli -c Release --no-build -- validate src/Ariadne.NET.slnx

      # Merges the Cobertura reports and fails below 80 percent line coverage, or when codecov.yml would let a drop in
      # coverage pass quietly.
      - name: Coverage gate
        if: runner.os == 'Linux'
        uses: MarcelRoozekrans/ci-baseline/actions/coverage-gate@v1
        with:
          reports: test-results/**/coverage.cobertura.xml

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: test-results/**/coverage.cobertura.xml
          disable_search: true   # only the files above, not every *.xml the search finds
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: ./test-results

  aot-smoke:
    runs-on: ubuntu-latest
    # Publishes tests/Ariadne.NET.AotSmoke with PublishAot=true and runs it: Ariadne.NET.Abstractions, its rule-pack
    # schema and the validators ZeroAlloc.Validation generates for it must survive ILC with every warning treated as an
    # error, including the full IL2xxx/IL3xxx trim/AOT surface.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install AOT native toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish AOT
        run: dotnet publish tests/Ariadne.NET.AotSmoke -c Release -r linux-x64 -p:PublishAot=true -warnaserror -o ./aot-out

      - name: Run AOT binary
        run: |
          status=0
          ./aot-out/Ariadne.NET.AotSmoke || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::The AOT binary failed with exit code $status"
            exit "$status"
          fi

  # Packs the five release packages exactly as publish-nuget does, inspects them, and rehearses the push against a local
  # folder feed, on every push and pull request, so the release path is exercised long before release day. A folder
  # feed silently drops .snupkg files, so symbol packages are checked by the inspection, not by the push.
  pack-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Read the release version
        shell: bash
        run: |
          version=$(jq -r '."." // empty' .release-please-manifest.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::.release-please-manifest.json gives '$version', not a version."
            exit 1
          fi
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Pack the release build
        run: dotnet pack src/Ariadne.NET.slnx -c Release -p:AriadneRelease=true -o artifacts/packages

      - name: Test the inspection script
        run: python3 -m unittest discover -s tools/release -p "test_inspect_packages.py"

      - name: Inspect the packages
        run: python3 tools/release/inspect_packages.py artifacts/packages "$PACKAGE_VERSION"

      - name: Rehearse the push against a local feed
        shell: bash
        run: |
          feed="$RUNNER_TEMP/local-feed"
          mkdir -p "$feed"
          dotnet nuget push "artifacts/packages/*.nupkg" --source "$feed" --skip-duplicate
          for package in artifacts/packages/*.nupkg; do
            if [ ! -f "$feed/$(basename "$package")" ]; then
              echo "::error::$(basename "$package") was pushed and did not arrive in the local feed."
              exit 1
            fi
          done
          before=$(find "$feed" -type f | wc -l)
          dotnet nuget push "artifacts/packages/*.nupkg" --source "$feed" --skip-duplicate
          after=$(find "$feed" -type f | wc -l)
          if [ "$before" -ne "$after" ]; then
            echo "::error::A second push changed the feed from $before to $after files; a re-run must change nothing."
            exit 1
          fi

      # Builds and runs the getting-started sample, tools/release/consumer/Program.cs, against the packages in the local
      # feed. nuget.config maps Ariadne.NET* to the local feed only, so the restore cannot fall back to a published
      # package. The sample references Ariadne.NET.Workspaces, which brings Ariadne.NET and then
      # Ariadne.NET.Abstractions in as dependencies: this proves those three of the five packages restore from the feed.
      # The next step restores Ariadne.NET.Testing the same way.
      # Microsoft.Extensions.DependencyInjection comes from nuget.org: Ariadne.NET depends only on the DI abstractions,
      # and the sample needs a container to resolve the services from. Microsoft.Build.Framework comes from nuget.org
      # too: Workspaces keeps its own copy out of the output because MSBuildLocator loads the SDK's, and that exclusion
      # does not flow to consumers, so the consumer carries its own reference with the runtime assets excluded or the
      # build fails with MSBL001. The sample also checks a directory against the pack, and the step runs it twice. First
      # against the consumer's own project, whose sources are a Program.cs without a namespace and one empty type in each
      # layer: no violations, so it must exit 0. Then against a fixture class library written under RUNNER_TEMP, a Domain
      # type that references a WebApi type, which the clean-architecture pack forbids, with an empty type in the other two
      # layers: it must exit exactly 1, so a crash fails too. The second run proves the packed library reports a
      # violation, not only that it stays quiet on clean code.
      - name: Restore, build and run a consumer from the local feed
        shell: bash
        run: |
          app="$RUNNER_TEMP/consumer"
          dotnet new console -o "$app" --framework net10.0
          cp tools/release/consumer/Program.cs "$app/Program.cs"
          # The pack fails a layer that covers no type, so the consumer holds one empty type in each layer of the
          # clean-architecture pack and the clean run below has nothing to report.
          for layer in Domain Application Infrastructure WebApi; do
            printf 'namespace Shop.%s;\npublic class Anchor { }\n' "$layer" > "$app/Anchor$layer.cs"
          done
          dotnet add "$app" package Ariadne.NET.Workspaces --version "$PACKAGE_VERSION" --no-restore
          dotnet add "$app" package Microsoft.Extensions.DependencyInjection --version 10.0.14 --no-restore
          # dotnet add package cannot set ExcludeAssets, so add the reference and then rewrite it in place. The grep
          # fails the step if the rewrite did not match, rather than letting the build fail later with MSBL001.
          dotnet add "$app" package Microsoft.Build.Framework --version 17.14.28 --no-restore
          sed -i 's|<PackageReference Include="Microsoft.Build.Framework" Version="17.14.28" />|<PackageReference Include="Microsoft.Build.Framework" Version="17.14.28" ExcludeAssets="runtime" />|' "$app/consumer.csproj"
          grep -q 'Include="Microsoft.Build.Framework".*ExcludeAssets="runtime"' "$app/consumer.csproj"
          cat > "$app/nuget.config" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="$RUNNER_TEMP/local-feed" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="local"><package pattern="Ariadne.NET*" /></packageSource>
              <packageSource key="nuget.org"><package pattern="*" /></packageSource>
            </packageSourceMapping>
          </configuration>
          EOF
          dotnet build "$app" -c Release
          dotnet run --project "$app" --no-build -c Release -- "$app"
          fixture="$RUNNER_TEMP/violation-fixture"
          mkdir -p "$fixture/Domain" "$fixture/Application" "$fixture/Infrastructure" "$fixture/WebApi"
          cat > "$fixture/Fixture.csproj" <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <Nullable>enable</Nullable>
            </PropertyGroup>
          </Project>
          EOF
          printf 'namespace Shop.Domain;\npublic class Order { public Shop.WebApi.Controller? Controller { get; init; } }\n' > "$fixture/Domain/Order.cs"
          printf 'namespace Shop.WebApi;\npublic class Controller { }\n' > "$fixture/WebApi/Controller.cs"
          printf 'namespace Shop.Application;\npublic class Anchor { }\n' > "$fixture/Application/Anchor.cs"
          printf 'namespace Shop.Infrastructure;\npublic class Anchor { }\n' > "$fixture/Infrastructure/Anchor.cs"
          dotnet restore "$fixture"
          set +e
          output=$(dotnet run --project "$app" --no-build -c Release -- "$fixture")
          code=$?
          set -e
          echo "$output"
          if [ "$code" -ne 1 ]; then
            echo "::error::Expected exit 1 for one violation, got $code. 0 means the packed validator reported none; anything else is a crash."
            exit 1
          fi
          if ! grep -q "DependencyNotAllowed" <<< "$output"; then
            echo "::error::Exit 1 without a DependencyNotAllowed violation in the output; the run failed for another reason."
            exit 1
          fi

      # Builds and runs tools/release/testing-consumer/Program.cs, a console app that references only
      # Ariadne.NET.Testing from the local feed and has no Microsoft.Build.Framework reference: the package must supply
      # the MSBuild fix itself through buildTransitive, or the build fails with MSBL001. The program checks a fixture
      # project written under RUNNER_TEMP against the pack in the fixture's own .architecture folder and must see the
      # one violation the pack forbids, which also proves the BuildHost folders reached the output. The step then fails
      # when any Microsoft.Build assembly other than Microsoft.Build.Locator.dll is in the output folder.
      - name: Restore, build and run a consumer of Ariadne.NET.Testing from the local feed
        shell: bash
        run: |
          app="$RUNNER_TEMP/testing-consumer"
          dotnet new console -o "$app" --framework net10.0
          cp tools/release/testing-consumer/Program.cs "$app/Program.cs"
          dotnet add "$app" package Ariadne.NET.Testing --version "$PACKAGE_VERSION" --no-restore
          cat > "$app/nuget.config" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="$RUNNER_TEMP/local-feed" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="local"><package pattern="Ariadne.NET*" /></packageSource>
              <packageSource key="nuget.org"><package pattern="*" /></packageSource>
            </packageSourceMapping>
          </configuration>
          EOF
          if grep -q "Microsoft.Build.Framework" "$app/testing-consumer.csproj"; then
            echo "::error::The consumer must not reference Microsoft.Build.Framework."
            exit 1
          fi
          dotnet build "$app" -c Release
          fixture="$RUNNER_TEMP/testing-fixture"
          mkdir -p "$fixture/.architecture" "$fixture/Domain" "$fixture/Infrastructure"
          cat > "$fixture/Fixture.csproj" <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <Nullable>enable</Nullable>
            </PropertyGroup>
          </Project>
          EOF
          cat > "$fixture/.architecture/fixture.yaml" <<EOF
          schema: 2
          name: fixture
          version: "1.0.0"
          author: ci
          layers:
            - name: Domain
              id: FIXTURE-LAYER-DOMAIN
              because: The domain may use the infrastructure in this layer list.
              namespaces: ["Shop.Domain"]
              allowedDependencies: [Infrastructure]
            - name: Infrastructure
              id: FIXTURE-LAYER-INFRASTRUCTURE
              because: Infrastructure stands alone.
              namespaces: ["Shop.Infrastructure"]
              allowedDependencies: []
          rules:
            - id: FIXTURE-DOMAIN-NO-INFRASTRUCTURE
              because: The domain must not depend on infrastructure.
              forbid:
                from:
                  layers: [Domain]
                to:
                  layers: [Infrastructure]
          EOF
          printf 'namespace Shop.Domain;\npublic class Order { public Shop.Infrastructure.Store? Store { get; init; } }\n' > "$fixture/Domain/Order.cs"
          printf 'namespace Shop.Infrastructure;\npublic class Store { }\n' > "$fixture/Infrastructure/Store.cs"
          dotnet restore "$fixture"
          dotnet run --project "$app" --no-build -c Release -- "$fixture"
          extra=$(find "$app/bin/Release" -name 'Microsoft.Build*.dll' ! -name 'Microsoft.Build.Locator.dll')
          if [ -n "$extra" ]; then
            echo "::error::Microsoft.Build assemblies other than Microsoft.Build.Locator.dll are in the consumer output:"
            echo "$extra"
            exit 1
          fi

      # Installs the ariadne dotnet tool from the packed local feed into a temp folder and runs it, which proves the
      # packed tool starts, loads a solution with MSBuild and reports. The tool is installed with --tool-path, never
      # globally, with a dedicated nuget.config whose source mapping sends Ariadne.NET* to the local feed only, so the
      # install cannot resolve the same version from nuget.org once Ariadne.NET.Cli is published and test the released
      # tool instead of the packed one. It runs four checks: --version prints exactly the release version; validate on tests/fixtures/twopacks
      # with --format json exits exactly 1 (a broken pack in a pack set), prints JSON with schema 1 on stdout and names
      # the broken pack; validate on a clean copy of tests/fixtures/clean exits 0; and the session-start hook, fed a
      # real session-start input with cwd at this repository, exits 0, writes nothing to stderr and prints JSON that
      # reports no rules load error. The clean fixture has no .architecture folder and ariadne would find this repository's own
      # pack above it, so the step copies the two projects and the solution to RUNNER_TEMP and writes a pack there that
      # the Shop solution satisfies. Fixtures are restored first with a normal dotnet restore, because ariadne never
      # restores. Every failed check is reported and the step fails at the end.
      - name: Install the tool from the local feed and run it
        shell: bash
        run: |
          dotnet restore tests/fixtures/twopacks/Shop.slnx
          clean="$RUNNER_TEMP/clean-fixture"
          mkdir -p "$clean/.architecture"
          cp -r tests/fixtures/clean/Shop.Domain tests/fixtures/clean/Shop.WebApi tests/fixtures/clean/Shop.slnx "$clean/"
          rm -rf "$clean"/Shop.*/bin "$clean"/Shop.*/obj
          cat > "$clean/.architecture/shop.yaml" <<EOF
          schema: 2
          name: shop
          version: "1.0.0"
          author: ci

          layers:
            - name: Domain
              id: SHOP-LAYER-DOMAIN
              because: The domain holds business rules only.
              assemblies: ["Shop.Domain"]
              allowedDependencies: []
            - name: WebApi
              id: SHOP-LAYER-WEBAPI
              because: The web API serves the domain.
              assemblies: ["Shop.WebApi"]
              allowedDependencies: [Domain]
          EOF
          dotnet restore "$clean/Shop.slnx"
          cat > "$RUNNER_TEMP/tool-nuget.config" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="$RUNNER_TEMP/local-feed" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="local"><package pattern="Ariadne.NET*" /></packageSource>
              <packageSource key="nuget.org"><package pattern="*" /></packageSource>
            </packageSourceMapping>
          </configuration>
          EOF
          dotnet tool install Ariadne.NET.Cli --tool-path "$RUNNER_TEMP/tool" --configfile "$RUNNER_TEMP/tool-nuget.config" --version "$PACKAGE_VERSION"
          ariadne="$RUNNER_TEMP/tool/ariadne"
          failed=0

          set +e
          version=$("$ariadne" --version)
          code=$?
          if [ "$code" -ne 0 ] || [ "$version" != "$PACKAGE_VERSION" ]; then
            echo "::error::ariadne --version gave '$version' with exit $code; expected exactly '$PACKAGE_VERSION' with exit 0."
            failed=1
          fi

          json=$("$ariadne" validate tests/fixtures/twopacks/Shop.slnx --format json)
          code=$?
          echo "$json"
          if [ "$code" -ne 1 ]; then
            echo "::error::validate on the twopacks fixture exited $code; expected exactly 1, one violation from the broken pack."
            failed=1
          fi
          if ! python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["schema"]==1' <<< "$json"; then
            echo "::error::The twopacks output is not JSON with schema 1."
            failed=1
          fi
          if ! grep -q "broken-pack" <<< "$json"; then
            echo "::error::The twopacks output does not name broken-pack."
            failed=1
          fi

          output=$("$ariadne" validate "$clean/Shop.slnx")
          code=$?
          echo "$output"
          if [ "$code" -ne 0 ]; then
            echo "::error::validate on the clean copy exited $code; expected 0."
            failed=1
          fi

          hook_input=$(python3 -c 'import json,os; print(json.dumps({"session_id": "ci", "hook_event_name": "SessionStart", "source": "startup", "cwd": os.getcwd()}))')
          hook_out=$("$ariadne" hook session-start <<< "$hook_input" 2> "$RUNNER_TEMP/hook-stderr.txt")
          code=$?
          hook_err=$(cat "$RUNNER_TEMP/hook-stderr.txt")
          if [ "$code" -ne 0 ]; then
            echo "::error::ariadne hook session-start exited $code; a hook must exit 0."
            failed=1
          fi
          if [ -n "$hook_err" ]; then
            echo "::error::ariadne hook session-start wrote to stderr: $hook_err"
            failed=1
          fi
          if ! python3 -c 'import json,sys; json.load(sys.stdin)' <<< "$hook_out"; then
            echo "::error::ariadne hook session-start did not print valid JSON: $hook_out"
            failed=1
          fi
          if grep -q "could not load" <<< "$hook_out"; then
            echo "::error::ariadne hook session-start could not load this repository's rules: $hook_out"
            failed=1
          fi
          set -e

          exit "$failed"

  # Lints the commit messages a pull request adds against .commitlintrc.yml. release-please builds the changelog and the
  # next version from these messages, and silently drops a commit it cannot parse, so a bad message is caught here,
  # before the merge. Pull-request events only: a push to main is a merge of commits this job already linted.
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The full history, so the PR's base and head commits are both present to lint between.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26

      # The same pins as Rag.NET; the two packages version independently, which is why the pins differ.
      - name: Lint the commits this pull request adds
        run: >
          npx --yes --package @commitlint/cli@21.2.1 --package @commitlint/config-conventional@21.2.0
          commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  # Publishes a release to nuget.org. release-please.yml dispatches this workflow on the release tag with
  # publish_to_nuget=true when it creates a release; a maintainer can dispatch it the same way with resume=true to
  # finish a push that died partway. It runs after build, aot-smoke and pack-validate on that exact commit, and it
  # refuses a prerelease and a tag that is not the manifest's version. The key comes from nuget.org's Trusted
  # Publishing; no key is stored. A .snupkg beside its .nupkg is delivered with the same push. The pack must pass
  # -p:AriadneRelease=true: without it Directory.Build.props versions every build X.Y.Z-local, and the version is
  # compiled into the DLLs, so a pack after a build without the switch would ship release-numbered packages whose DLLs
  # still say -local. RELEASING.md has the procedure.
  publish-nuget:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_to_nuget && startsWith(github.ref, 'refs/tags/v')
    needs: [ build, aot-smoke, pack-validate ]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Refuse anything but a stable release from its own tag
        shell: bash
        run: |
          version=$(jq -r '."." // empty' .release-please-manifest.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Refusing to publish '$version': it is not a stable version."
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Refusing to publish: the tag is $GITHUB_REF_NAME but the manifest says $version."
            exit 1
          fi
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Pack the release build
        run: dotnet pack src/Ariadne.NET.slnx -c Release -p:AriadneRelease=true -o artifacts/packages

      - name: Inspect the packages
        run: python3 tools/release/inspect_packages.py artifacts/packages "$PACKAGE_VERSION"

      - name: Mint a short-lived nuget.org key
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}

      # A release run pushes without --skip-duplicate, so a version that is already on nuget.org fails the run instead of
      # being skipped while the job goes green. Only a dispatch with resume=true, which finishes a push that died partway,
      # skips the packages that already arrived.
      - name: Push to nuget.org
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          RESUME: ${{ inputs.resume }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::NuGet/login minted no key. Check the NUGET_USER repository variable and the Trusted Publishing policy on nuget.org; see RELEASING.md."
            exit 1
          fi
          skip_duplicate=""
          if [ "$RESUME" = "true" ]; then
            skip_duplicate="--skip-duplicate"
          fi
          if ! dotnet nuget push "artifacts/packages/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" $skip_duplicate; then
            echo "::error::nuget.org refused the push; its reason is on the error line above. A 409 can mean the version already exists or that the package ID is reserved by another owner. The Trusted Publishing policy must allow all five packages, including any new package id; see RELEASING.md before re-running."
            exit 1
          fi

      - name: Attach the packages to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" artifacts/packages/*.nupkg artifacts/packages/*.snupkg --clobber

      # A CycloneDX SBOM of the solution, attached to the same release. The release exists by now: release-please
      # created it before dispatching this workflow.
      - name: Attach the SBOM to the GitHub release
        uses: MarcelRoozekrans/ci-baseline/actions/sbom@v1
        with:
          solution: src/Ariadne.NET.slnx
          tag: ${{ github.ref_name }}
