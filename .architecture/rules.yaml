schema: 2
name: ariadne
version: "1.0.0"
author: ariadne

layers:
  - name: Core
    id: ARIADNE-LAYER-CORE
    because: The schema, rule engine, analysis and code generation are the library itself and must not depend on any host.
    description: "Abstractions, rule engine, semantic analysis, code generation"
    assemblies: ["Ariadne.NET.Abstractions", "Ariadne.NET"]
    allowedDependencies: []
  - name: Workspaces
    id: ARIADNE-LAYER-WORKSPACES
    because: Loading solutions through MSBuild is an optional add-on to the core and must stay out of it.
    description: "MSBuild workspace loading"
    assemblies: ["Ariadne.NET.Workspaces"]
    allowedDependencies:
      - Core
  - name: Host
    id: ARIADNE-LAYER-HOST
    because: The CLI, hooks, MCP servers and testing package are thin wrappers that compose the core and the workspace loader.
    description: "CLI and MCP hosts, and the testing package"
    assemblies: ["Ariadne.NET.Cli", "Ariadne.NET.Hooks", "Ariadne.NET.Mcp", "Ariadne.NET.Mcp.Http", "Ariadne.NET.Testing"]
    allowedDependencies:
      - Core
      - Workspaces
  - name: Tests
    id: ARIADNE-LAYER-TESTS
    because: Tests exercise every other layer, and no shipped code may depend on them.
    description: "Unit, integration and AOT smoke tests"
    assemblies: ["*.Tests", "Ariadne.NET.AotSmoke"]
    allowedDependencies:
      - Core
      - Workspaces
      - Host

rules:
  - id: ARIADNE-CORE-NO-HOSTS
    because: Core is a library every host uses; it must not know them.
    description: "Core never references a host or the workspace loader"
    forbid:
      from:
        layers: [Core]
      to:
        assemblies: ["Ariadne.NET.Cli", "Ariadne.NET.Hooks", "Ariadne.NET.Mcp", "Ariadne.NET.Mcp.Http", "Ariadne.NET.Workspaces"]
  - id: ARIADNE-CORE-NO-HOST-FRAMEWORKS
    because: Hosts orchestrate; Core holds the logic and runs inside any of them.
    description: "Core never uses a host framework"
    forbid:
      from:
        layers: [Core]
      to:
        namespaces: ["Microsoft.AspNetCore.**", "System.CommandLine.**", "ModelContextProtocol.**"]
  - id: ARIADNE-RULE-ENGINES-INTERNAL
    because: The rule evaluators are an implementation detail of the validator and must not become public API.
    description: "Static rule evaluators in Analysis stay internal classes"
    require:
      for:
        types: ["Ariadne.NET.Analysis.*Rules"]
      kind: class
      accessibility: internal
  - id: ARIADNE-PACK-LOADERS-IN-CORE
    because: Loading rule packs is part of the library itself; hosts and the workspace loader only consume it.
    description: "Every IRulePackLoader implementation lives in Core"
    require:
      for:
        interfaces: ["Ariadne.NET.Abstractions.IRulePackLoader"]
      layer: Core
  - id: ARIADNE-HOST-NAMES-OWN
    because: A host type that reuses a Core type name reads as the same type in stack traces, logs and imports, and hides which layer owns it.
    description: "Host types never copy a type name from Core"
    uniqueNames:
      for:
        layers: [Host]
      against:
        layers: [Core]
  - id: ARIADNE-CORE-NO-CONSOLE
    because: Core is a library that runs inside every host, so only a host decides what is written to the console, and the MCP stdio server reserves stdout for its protocol.
    description: "Core never writes to or reads from System.Console"
    forbid:
      from:
        layers: [Core]
      to:
        members: ["System.Console.*"]
  - id: ARIADNE-NO-NEWTONSOFT-JSON
    because: The repository serializes with System.Text.Json, which stays trim and Native AOT safe; Newtonsoft.Json relies on reflection and would break the AOT smoke test.
    description: "No project references Newtonsoft.Json, directly or transitively"
    bannedPackages:
      packages: ["Newtonsoft.Json"]
